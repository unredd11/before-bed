{% extends 'base.html' %}

{% block content %}
<p class="eyebrow">STAFF OVERVIEW</p>
<h1>BeforeBed at a glance</h1>

<div class="stats">
  <section class="card">
    <h2>{{ users }}</h2>
    Accounts
  </section>
  <section class="card">
    <h2>{{ tasks }}</h2>
    Tasks
  </section>
  <section class="card">
    <h2>{{ complete }}</h2>
    Completed tasks
  </section>
  <section class="card">
    <h2>{{ entries }}</h2>
    Sleep entries
  </section>
</div>

<a href="{% url 'admin:index' %}">Open Django administration</a>
{% endblock %}
